# ==============================================================================
# GeoNetra · Docker Compose Orchestration Specification
# One-command launch: docker compose up -d --build
# ==============================================================================

version: "3.8"

services:
  geonetra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geonetra-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=geonetra-production-deployment-secret-2026
      # Set your Gemini API key and MongoDB Atlas connection string below:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_api_key_here}
      - MONGODB_URI=${MONGODB_URI:-}
    volumes:
      # Mount data volume so local JSON fallback persists across container rebuilds
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
